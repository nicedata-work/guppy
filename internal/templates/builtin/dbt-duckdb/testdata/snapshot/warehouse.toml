[[file]]
  path = "dbt/profiles.yml"
  mode = "0644"
  content = "# Local DuckDB profile — verbatim payload (not a .hbs file): dbt's own\n# Jinja (env_var below) collides with the guppy renderer's double-brace\n# syntax, and the profile name is the fixed \"local\", so no substitution is\n# needed. The database path comes from DBT_DUCKDB_PATH, exported by\n# tools/env/dbt.sh and the `gp dbt` verb: the dbt 2.0 engine resolves\n# relative paths against its own binary location under `bazel run`, so an\n# absolute path is required.\nlocal:\n  target: local\n\n  outputs:\n    local:\n      type: duckdb\n      path: \"{{ env_var('DBT_DUCKDB_PATH') }}\"\n      threads: 4\n"

[[file]]
  path = "dbt/smoke_test.py"
  mode = "0644"
  content = "\"\"\"Hermetic smoke test: `dbt build` end to end (guppy dbt-duckdb).\n\nRuns against a temp DuckDB file with temp target/log dirs, so neither the\nchecked-in project tree nor the runfiles are written to.\n\"\"\"\n\nimport os\nimport sys\nimport tempfile\n\nfrom dbt.runner import dbtRunner\n\n\ndef project_dir() -> str:\n    \"\"\"Locate dbt/ in the test runfiles (cwd or TEST_SRCDIR layouts).\"\"\"\n    candidates = [\n        os.path.join(os.getcwd(), \"dbt\"),\n        os.path.join(\n            os.environ.get(\"TEST_SRCDIR\", \"\"),\n            os.environ.get(\"TEST_WORKSPACE\", \"_main\"),\n            \"dbt\",\n        ),\n    ]\n    for candidate in candidates:\n        if os.path.isfile(os.path.join(candidate, \"dbt_project.yml\")):\n            return candidate\n    raise SystemExit(f\"dbt project not found in runfiles; tried: {candidates}\")\n\n\ndef main() -> int:\n    project = project_dir()\n    with tempfile.TemporaryDirectory() as tmp:\n        # The profile's relative duckdb path resolves against the cwd; the\n        # DBT_* path vars keep target/ and logs/ inside the sandbox too.\n        os.makedirs(os.path.join(tmp, \"data\"))\n        os.environ.update(\n            {\n                \"DBT_DUCKDB_PATH\": os.path.join(tmp, \"data\", \"smoke.duckdb\"),\n                \"DBT_PROJECT_DIR\": project,\n                \"DBT_PROFILES_DIR\": project,\n                \"DBT_LOG_PATH\": os.path.join(tmp, \"logs\"),\n                \"DBT_TARGET_PATH\": os.path.join(tmp, \"target\"),\n            }\n        )\n        os.chdir(tmp)\n        result = dbtRunner().invoke([\"build\"])\n    return 0 if result.success else 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"

