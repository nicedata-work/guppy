[[file]]
  path = "dbt/BUILD.bazel"
  mode = "0644"
  content = "load(\"@rules_python//python:defs.bzl\", \"py_test\")\nload(\"@rules_python//python/entry_points:py_console_script_binary.bzl\", \"py_console_script_binary\")\nload(\"@pypi//:requirements.bzl\", \"requirement\")\n\n# dbt 2.0: the engine is Rust compiled into a Python wheel; the console\n# script and its closure are pinned by //:requirements_lock.txt. The pip\n# hub does not resolve extras of transitive dependencies, so dbt's\n# `mashumaro[msgpack]` requirement is declared explicitly here.\npy_console_script_binary(\n    name = \"dbt\",\n    pkg = \"@pypi//dbt\",\n    script = \"dbt\",\n    deps = [\n        requirement(\"mashumaro\"),\n        requirement(\"msgpack\"),\n    ],\n)\n\n# Hermetic smoke test: `dbt build` end to end against a temp DuckDB file.\npy_test(\n    name = \"smoke_test\",\n    srcs = [\"smoke_test.py\"],\n    data = glob([\n        \"dbt_project.yml\",\n        \"macros/**\",\n        \"models/**\",\n        \"profiles.yml\",\n        \"tests/**\",\n    ]),\n    deps = [\n        requirement(\"dbt\"),\n        requirement(\"mashumaro\"),\n        requirement(\"msgpack\"),\n    ],\n)\n\n"

[[file]]
  path = "dbt/dbt_project.yml"
  mode = "0644"
  content = "name: \"warehouse\"\nconfig-version: 2\nprofile: \"local\"\nrequire-dbt-version: [\">=2.0,<3\"]\n\nmodel-paths: [\"models\"]\ntest-paths: [\"tests\"]\nmacro-paths: [\"macros\"]\ntarget-path: \"target\"\nlog-path: \"logs\"\nclean-targets: [\"target\", \"logs\"]\n\nmodels:\n  warehouse:\n    +materialized: view\n    +on_schema_change: append_new_columns\n    +persist_docs:\n      relation: true\n      columns: true\n    model:\n      +schema: model\n    expose:\n      +schema: expose\n    semantic:\n      +schema: semantic\n"

