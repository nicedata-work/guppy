[[file]]
  path = ".envrc"
  mode = "0644"
  content = "# direnv wiring for warehouse — the guppy environment contract\n# (design §3.4): pinned toolchains via Bazel, project-scoped shims in\n# .direnv/bin/, nothing on the global PATH. Activate with:\n#\n#   direnv allow .\n#\n# source_env pushes into each sourced file's directory while loading it,\n# so the scripts below resolve the project root from GUPPY_ROOT, not\n# $PWD.\nGUPPY_ROOT=\"$PWD\"\nsource_env tools/env/setup.sh\nsource_env tools/env/dbt.sh\nsource_env tools/env/banner.sh\n\n"

[[file]]
  path = ".gitignore"
  mode = "0644"
  content = "# warehouse — ignore rules scaffolded by guppy (dbt-duckdb).\n# Contextual ignores: only what this project's toggles enable.\n.direnv/\n/.bazel/\n.DS_Store\n*.swp\n\n# dbt + DuckDB runtime state (the local database lives in data/)\ndbt/target/\ndbt/logs/\ndbt/dbt_packages/\ndata/*.duckdb\n__pycache__/\n.ruff_cache/\n"

[[file]]
  path = ".nvmrc"
