[[file]]
  path = ".sqlfluff"
  mode = "0644"
  content = "[sqlfluff]\ndialect = duckdb\ntemplater = jinja\noutput_line_length = 200\nmax_line_length = 120\nrunaway_limit = 10\nignore_templated_areas = True\nencoding = utf-8\nformat = human\nsql_file_exts = .sql,.sql.j2,.dml,.ddl\nlarge_file_skip_byte_limit = 50000\nprocesses = 10\n\n[sqlfluff:indentation]\nindented_joins = False\ntemplate_blocks_indent = True\nindent_unit = space\ntab_space_size = 2\n\n[sqlfluff:layout:type:comma]\nline_position = trailing\n\n[sqlfluff:templater]\nunwrap_wrapped_queries = False\n\n# dbt stub macros: lets sqlfluff lint dbt SQL outside of dbt — `ref()`,\n# `source()`, `config()` etc. render to placeholders instead of erroring.\n[sqlfluff:templater:jinja:macros]\ndbt_ref = {% macro ref(model_ref) %}{{model_ref}}{% endmacro %}\ndbt_source = {% macro source(source_name, table) %}{{source_name}}_{{table}}{% endmacro %}\ndbt_config = {% macro config() %}{% for k in kwargs %}{% endfor %}{% endmacro %}\ndbt_var = {% macro var(variable) %}item{% endmacro %}\ndbt_is_incremental = {% macro is_incremental() %}False{% endmacro %}\n\n[sqlfluff:rules]\nallow_scalar = True\nsingle_table_references = consistent\nunquoted_identifiers_policy = all\n\n[sqlfluff:rules:capitalisation.keywords]\ncapitalisation_policy = lower\n\n[sqlfluff:rules:capitalisation.identifiers]\nextended_capitalisation_policy = lower\nunquoted_identifiers_policy = all\n\n[sqlfluff:rules:capitalisation.functions]\ncapitalisation_policy = lower\n\n[sqlfluff:rules:capitalisation.literals]\ncapitalisation_policy = lower\n\n[sqlfluff:rules:capitalisation.types]\nextended_capitalisation_policy = lower\n\n[sqlfluff:rules:convention.select_trailing_comma]\nselect_clause_trailing_comma = forbid\n\n[sqlfluff:rules:convention.not_equal]\npreferred_not_equal_style = c_style\n\n[sqlfluff:rules:convention.count_rows]\nprefer_count_0 = False\nprefer_count_1 = False\n"

[[file]]
  path = ".sqlfluffignore"
  mode = "0644"
  content = "# dbt build artifacts are compiled copies of the models — never linted.\ndbt/target/\ndbt/logs/\ndbt/dbt_packages/\n"

[[file]]
  path = "AGENTS.md"
  mode = "0644"
  content = "# AGENTS.md\n\nGuidance for agents and human contributors working in warehouse.\n\n## Conventions\n\n- Build with Bazel; the dev environment is hermetic (pinned toolchains,\n  direnv-activated) — never install tools globally.\n- The dbt project lives in `dbt/` and mirrors the target database's schema\n  layout: `models/model/` (core models → schema `model`), `models/expose/`\n  (analysis-ready marts → schema `expose`), `models/semantic/` (governed\n  views → schema `semantic`).\n- Run dbt through the project verbs (`gp dbt build`, `gp dbt test`) so the\n  Bazel-pinned engine is used; never install dbt globally.\n- SQL style is enforced by sqlfluff and Python by ruff (`gp lint` /\n  `gp format`); keep both green before committing.\n\n"

[[file]]
  path = "BUILD.bazel"
  mode = "0644"
  content = "# Root package for warehouse — hermetic linters from the pip hub; the\n# dbt toolchain itself lives in //dbt (guppy dbt-duckdb template).\nload(\"@rules_python//python:defs.bzl\", \"py_binary\")\nload(\"@rules_python//python/entry_points:py_console_script_binary.bzl\", \"py_console_script_binary\")\nload(\"@pypi//:requirements.bzl\", \"requirement\")\n\npy_console_script_binary(\n    name = \"sqlfluff\",\n    pkg = \"@pypi//sqlfluff\",\n    script = \"sqlfluff\",\n)\n\n# ruff ships its CLI as a wheel-installed binary rather than a console\n# script, so it is wrapped through the package (see tools/ruff_main.py).\npy_binary(\n    name = \"ruff\",\n    srcs = [\"tools/ruff_main.py\"],\n    data = [\"@pypi//ruff:data\"],\n    main = \"tools/ruff_main.py\",\n    deps = [requirement(\"ruff\")],\n)\n\n"

[[file]]
  path = "MODULE.bazel"
  mode = "0644"
  content = "# Workspace for warehouse — scaffolded by guppy (dbt-duckdb). The Python\n# toolchain and the dbt/sqlfluff/ruff closure are fetched hermetically from\n# requirements_lock.txt (design §3.4): nothing is expected from the machine's\n# global environment.\nmodule(\n    name = \"warehouse\",\n    version = \"0.1.0\",\n)\n\nbazel_dep(name = \"rules_python\", version = \"2.4.2\")\n\npython = use_extension(\"@rules_python//python/extensions:python.bzl\", \"python\")\npython.toolchain(\n    is_default = True,\n    python_version = \"3.14\",\n)\n\npip = use_extension(\"@rules_python//python/extensions:pip.bzl\", \"pip\")\npip.parse(\n    hub_name = \"pypi\",\n    python_version = \"3.14\",\n    requirements_lock = \"//:requirements_lock.txt\",\n)\nuse_repo(pip, \"pypi\")\n\n"

[[file]]
  path = "README.md"
  mode = "0644"
  content = "# warehouse\n\nA dbt 2.0 project on DuckDB scaffolded by [guppy](https://nicedata.work/guppy)\nfrom the `dbt-duckdb` template (extends `base-toolchain`).\n\nThe dev environment is hermetic(Bazel-pinned, direnv-activated — design §3.4):\nrun `direnv allow .` once, then use the project verbs:\n\n```sh\ngp dbt build     # dbt build — models → tests (via //dbt:dbt; sets DBT_DUCKDB_PATH)\ngp dbt test      # dbt data/singular tests only; extra dbt args pass through\ngp test          # bazel test //... — hermetic dbt smoke test\ngp lint          # sqlfluff over dbt/ + ruff over Python\ngp format        # ruff format\n```\n\nNo direnv? The same verbs work explicitly: `guppy project dbt build`.\nThe `dbt` verb needs `DBT_DUCKDB_PATH` (absolute path to the local\ndatabase) — it is exported by `tools/env/dbt.sh` under direnv and set\ninline by the verb; raw `bazel run //dbt:dbt` needs it exported by hand.\n\n## Layout\n\n```text\ndbt/\n├── dbt_project.yml    # +schema mapping: model / expose / semantic\n├── profiles.yml       # local duckdb profile; path from DBT_DUCKDB_PATH\n├── macros/            # generate_schema_name: custom schemas land unprefixed\n├── models/\n│   ├── model/         # core models      → schema `model`\n│   ├── expose/        # analysis-ready   → schema `expose`\n│   └── semantic/      # governed views   → schema `semantic`\n└── tests/             # singular tests\n```\n\nThe scaffolded models are placeholders — replace their logic, keep the\nlayering: `expose` joins the model layer into analysis-ready relations,\n`semantic` curates what consumers see.\n\n## Toolchain\n\nPython deps (dbt 2.0, sqlfluff, ruff) are declared in `pyproject.toml` and\npinned in `requirements_lock.txt`, which MODULE.bazel feeds to the pip hub —\ndbt 2.0 is a Rust engine shipped as a Python wheel, fetched per host platform\nat Bazel fetch time. To bump dependencies:\n\n```sh\ngp lock         # uv pip compile --python-version 3.14 pyproject.toml -o requirements_lock.txt\n```\n"

