[[file]]
  path = "tools/env/banner.sh"
  mode = "0644"
  content = "# tools/env/banner.sh — one-line environment banner on activation.\n# Suppressed with GUPPY_QUIET=1 (the same switch the CLI honors, §6).\nROOT=\"${GUPPY_ROOT:-$PWD}\"\nif [ \"${GUPPY_QUIET:-0}\" != \"1\" ]; then\n  log_status \"warehouse: hermetic env active (bazel $(cat \"$ROOT/.bazelversion\" 2>/dev/null || echo unpinned)); gp shims in .direnv/bin\"\nfi\n\n"

[[file]]
  path = "tools/env/dbt.sh"
  mode = "0644"
  content = "# tools/env/dbt.sh — dbt wiring for warehouse: profiles live in dbt/,\n# the local DuckDB database under data/ (created on first activation so\n# the profile's path always resolves — the dbt 2.0 engine needs an\n# absolute DBT_DUCKDB_PATH, which this exports). Sourced from .envrc;\n# idempotent, safe on every activation.\nROOT=\"${GUPPY_ROOT:-$PWD}\"\nexport DBT_PROFILES_DIR=\"$ROOT/dbt\"\nexport DBT_DUCKDB_PATH=\"$ROOT/data/warehouse.duckdb\"\nmkdir -p \"$ROOT/data\"\n\n"

[[file]]
  path = "tools/env/setup.sh"
  mode = "0644"
  content = "# tools/env/setup.sh — activate the hermetic environment for warehouse\n# (guppy environment contract, design §3.4). Sourced from .envrc by\n# direnv; idempotent, safe on every activation, and it never writes\n# outside the project tree.\nROOT=\"${GUPPY_ROOT:-$PWD}\"\n\nif ! has bazel; then\n  log_error \"bazel not found — install bazelisk: https://bazel.build/install/bazelisk\"\nfi\n\n# The shim dir: project-scoped shims live here, never on the global PATH.\n# The gp shim — the project face of guppy (§3.5) — is materialized on\n# every activation, so it always points at the currently installed\n# guppy and exists only while this project's environment is active.\nSHIM_DIR=\"$ROOT/.direnv/bin\"\nmkdir -p \"$SHIM_DIR\"\nif has guppy; then\n  ln -sfn \"$(command -v guppy)\" \"$SHIM_DIR/gp\"\nelse\n  log_status \"guppy not found — gp shim unavailable (fallback: guppy project <verb>)\"\nfi\nPATH_add \"$SHIM_DIR\"\n\n"

[[file]]
  path = "tools/ruff_main.py"
  mode = "0644"
  content = "\"\"\"Run ruff from the pip hub.\n\nruff ships its CLI as a wheel-installed binary (no console_scripts entry\npoint), so instead of `python -m ruff`'s sysconfig probing — which cannot\nsee Bazel runfiles — the binary is resolved relative to the package and\nexec'd directly. `@pypi//ruff:data` puts bin/ruff into the runfiles tree.\n\"\"\"\n\nimport os\nimport sys\n\nimport ruff\n\nruff_bin = os.path.join(\n    os.path.dirname(os.path.dirname(os.path.dirname(ruff.__file__))), \"bin\", \"ruff\"\n)\nos.execv(ruff_bin, [ruff_bin, *sys.argv[1:]])\n"
