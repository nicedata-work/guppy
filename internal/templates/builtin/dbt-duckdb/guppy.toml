id          = "dbt-duckdb"
version     = "0.1.0"
kind        = "app"
language    = "python"
description = "dbt 2.0 on DuckDB with model/expose/semantic schema layers, sqlfluff + ruff, and a hermetic Bazel Python toolchain — extends base-toolchain"

extends = ["base-toolchain"]

# Axes this template actually wires: `linters` gates the sqlfluff/ruff
# console scripts and configs; `tests` gates the hermetic dbt smoke test.
[defaults]
linters = true
tests   = true

# `build`/`test` come from base-toolchain. `dbt` takes the subcommand and
# flags as pass-through args: `gup dbt build`, `gup dbt test --select …`.
[gup]
dbt    = { command = "DBT_DUCKDB_PATH=\"$PWD/data/{{ .name | kebab }}.duckdb\" bazel run //dbt:dbt -- --project-dir \"$PWD/dbt\" --profiles-dir \"$PWD/dbt\"", requires = ["bazel"] }
lint   = { command = "bazel run //:sqlfluff -- lint \"$PWD/dbt\" && bazel run //:ruff -- check \"$PWD\"", requires = ["bazel", "linters"] }
format = { command = "bazel run //:ruff -- format \"$PWD\"", requires = ["bazel", "linters"] }
lock   = "uv pip compile --python-version 3.14 pyproject.toml -o requirements_lock.txt"
