[[file]]
  path = "README.md"
  mode = "0644"
  content = "# example-name — team template registry\n\nA shared [guppy](https://github.com/nicedata-work/guppy) template\nregistry owned by your team: templates live in this repo, CI validates\nthem and builds the registry, and consumers point guppy here once.\n\n## How it works\n\n- `templates/<id>/` — one directory per template (`guppy.toml`,\n  `tests.toml`, `testdata/snapshot/`, `template/` payload)\n- CI (`.github/workflows/registry.yml`) runs `guppy lint` + `guppy test`\n  on every PR, then rebuilds `index.json` + `tarballs/` on merge —\n  this repo's checkout is always a complete, current registry\n\n## Team workflow\n\n1. Drop a template into `templates/<id>/` — see the\n   [authoring guide](https://github.com/nicedata-work/guppy/blob/main/docs/guides/authoring-templates.md).\n2. Open a PR; CI validates it.\n3. Merge; CI commits the rebuilt registry.\n4. Consumers configure guppy once (per machine):\n\n```toml\n# ~/.config/guppy/guppy.toml\n[[template.registries]]\nname = \"team\"\ngit = \"<this repo's git URL>\"\n# ref = \"main\"\n# trust = \"full\"   # optional: skip the install-time review gate — this org vouches for the registry\n```\n\nThen everything resolves from here:\n\n```sh\nguppy template search             # team templates (labeled \"team\") + public ones\nguppy new --template <id> mydir   # scaffold from a team template\nguppy template update <id>        # move to a newer published version\n```\n\n## Local commands\n\n```sh\nguppy project build   # rebuild index.json + tarballs/ (scripts/build-registry.py)\nguppy project test    # guppy lint + guppy test on every template\nguppy project lint    # drift check: fails when the registry is stale\n```\n\nWire direnv for the `gup` shorthand — see\n[working on projects](https://github.com/nicedata-work/guppy/blob/main/docs/guides/gup-workflows.md).\n"

[[file]]
  path = "index.json"
  mode = "0644"
  content = "{\"schema\": 1, \"templates\": []}\n"

[[file]]
  path = "scripts/build-registry.py"
  mode = "0644"
  content = "#!/usr/bin/env python3\n\"\"\"Builds the registry from templates/: index.json + tarballs/.\n\nEvery directory under templates/ containing a guppy.toml is one\npublished template version (the version comes from its manifest). The\nbuild packs each one into tarballs/guppy-<id>-<version>.tar.gz (a\nsingle top-level <id>/ directory — exactly what guppy's client\nstrips), records the sha256, and regenerates index.json (schema 1).\n\nStale tarballs (template removed, or a version bumped without a new\nentry) are pruned: this repo's checkout is always a complete, current\nregistry, ready to be consumed via [[template.registries]].\n\nUsage: build-registry.py [--check]\n    (default) build: (re)write index.json and tarballs/\n    --check   exit 1 if the on-disk registry is stale, without writing\n\"\"\"\nimport gzip\nimport hashlib\nimport io\nimport json\nimport os\nimport sys\nimport tarfile\nimport tomllib\n\nROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))\nTEMPLATES_DIR = os.path.join(ROOT, \"templates\")\nTARBALLS_DIR = os.path.join(ROOT, \"tarballs\")\nINDEX = os.path.join(ROOT, \"index.json\")\nKEYWORD = \"guppy-template\"\n\n\ndef fail(msg):\n    print(f\"error: {msg}\", file=sys.stderr)\n    sys.exit(1)\n\n\ndef collect():\n    \"\"\"Returns [(dir, manifest)] for every template under templates/.\"\"\"\n    out = []\n    if not os.path.isdir(TEMPLATES_DIR):\n        return out\n    for name in sorted(os.listdir(TEMPLATES_DIR)):\n        d = os.path.join(TEMPLATES_DIR, name)\n        manifest_path = os.path.join(d, \"guppy.toml\")\n        if not os.path.isfile(manifest_path):\n            continue\n        with open(manifest_path, \"rb\") as f:\n            m = tomllib.load(f)\n        if not m.get(\"id\") or not m.get(\"version\"):\n            fail(f\"templates/{name}: guppy.toml needs id and version\")\n        out.append((d, m))\n    return out\n\n\ndef build_tarball(src_dir, template_id):\n    \"\"\"Packs src_dir as <template_id>/… into a tar.gz; returns bytes.\n\n    Deterministic: sorted entries, zeroed mtimes/uid/gid — same inputs\n    produce byte-identical tarballs, so CI rebuilds are no-op diffs.\n    \"\"\"\n    raw = io.BytesIO()\n    with tarfile.open(fileobj=raw, mode=\"w\") as tar:\n        for base, dirs, files in os.walk(src_dir):\n            dirs.sort()\n            for f in sorted(files):\n                path = os.path.join(base, f)\n                arcname = os.path.join(template_id, os.path.relpath(path, src_dir))\n                info = tar.gettarinfo(path, arcname=arcname)\n                info.uid = info.gid = 0\n                info.uname = info.gname = \"\"\n                info.mtime = 0\n                with open(path, \"rb\") as fh:\n                    tar.addfile(info, fh)\n    gz = io.BytesIO()\n    with gzip.GzipFile(fileobj=gz, mode=\"wb\", mtime=0) as gzout:\n        gzout.write(raw.getvalue())\n    return gz.getvalue()\n\n\ndef desired():\n    \"\"\"Returns (index_dict, {tarball_name: bytes}) for templates/.\"\"\"\n    templates = []\n    tarballs = {}\n    for d, m in collect():\n        tid, version = m[\"id\"], m[\"version\"]\n        data = build_tarball(d, tid)\n        name = f\"guppy-{tid}-{version}.tar.gz\"\n        tarballs[name] = data\n        templates.append({\n            \"id\": tid,\n            \"version\": version,\n            \"kind\": m.get(\"kind\", \"\"),\n            \"language\": m.get(\"language\", \"\"),\n            \"description\": m.get(\"description\", \"\"),\n            \"keywords\": [KEYWORD, m.get(\"kind\", \"\"), m.get(\"language\", \"\")],\n            \"tarball\": f\"tarballs/{name}\",\n            \"sha256\": hashlib.sha256(data).hexdigest(),\n        })\n    return {\"schema\": 1, \"templates\": templates}, tarballs\n\n\ndef current_tarballs():\n    names = {}\n    if os.path.isdir(TARBALLS_DIR):\n        for f in sorted(os.listdir(TARBALLS_DIR)):\n            if f.endswith(\".tar.gz\"):\n                names[f] = open(os.path.join(TARBALLS_DIR, f), \"rb\").read()\n    return names\n\n\ndef main():\n    check = \"--check\" in sys.argv[1:]\n    index, tarballs = desired()\n\n    if check:\n        try:\n            on_disk = json.load(open(INDEX))\n        except (OSError, json.JSONDecodeError):\n            print(\"registry is stale: index.json missing or unparsable\", file=sys.stderr)\n            sys.exit(1)\n        stale = on_disk != index or current_tarballs() != tarballs\n        if stale:\n            print(\"registry is stale — run: guppy project build \"\n                  \"(python3 scripts/build-registry.py)\", file=sys.stderr)\n            sys.exit(1)\n        print(\"registry is up to date\")\n        return\n\n    os.makedirs(TARBALLS_DIR, exist_ok=True)\n    for name, data in tarballs.items():\n        with open(os.path.join(TARBALLS_DIR, name), \"wb\") as f:\n            f.write(data)\n    for name in set(current_tarballs()) - set(tarballs):\n        os.remove(os.path.join(TARBALLS_DIR, name))  # stale version tarballs\n    with open(INDEX, \"w\") as f:\n        json.dump(index, f, indent=2)\n        f.write(\"\\n\")\n    print(f\"registry: {len(tarballs)} template(s) indexed\")\n\n\nif __name__ == \"__main__\":\n    main()\n"

[[file]]
  path = "scripts/validate-templates.sh"
  mode = "0644"
  content = "#!/usr/bin/env bash\n# Validates every template under templates/: guppy lint + guppy test.\n# CI runs this on every PR; run it locally before pushing.\nset -euo pipefail\n\nroot=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"\nfail=0\nfound=0\nfor d in \"$root\"/templates/*/; do\n    [ -f \"$d/guppy.toml\" ] || continue\n    found=1\n    echo \"== $(basename \"$d\")\"\n    guppy lint \"$d\" || fail=1\n    guppy test \"$d\" || fail=1\ndone\n[ \"$found\" = 1 ] || echo \"no templates yet — drop the first one into templates/<id>/\"\nexit \"$fail\"\n"

[[file]]
  path = "templates/README.md"
  mode = "0644"
  content = "# templates/ — the drop zone\n\nOne directory per template, named after its id. Each contains:\n\n```text\ntemplates/<id>/\n├── guppy.toml            # manifest: id, version, kind, language, [vars], [defaults], [gup]\n├── tests.toml            # render-matrix cases for guppy test\n├── testdata/snapshot/    # golden snapshots (committed — CI runs guppy test)\n└── template/             # the payload; .hbs files are rendered, the rest copied verbatim\n```\n\nThe version in each `guppy.toml` **is** the published version: bump it\nto release, and CI publishes a new `index.json` entry + tarball for it.\n\nReference: the\n[authoring guide](https://github.com/nicedata-work/guppy/blob/main/docs/guides/authoring-templates.md)\nand the first-party templates in the\n[guppy repo](https://github.com/nicedata-work/guppy/tree/main/internal/templates/builtin)\nare good starting points (start from `base-toolchain` structure, copy\nwhat you need — templates are plain directories).\n"
